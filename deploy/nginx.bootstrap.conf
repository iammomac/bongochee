# First-boot only: used before a certificate exists yet, so there's nothing to
# redirect to. Serves the ACME challenge (for certbot to issue the first cert) and
# plain HTTP in the meantime. Once the cert is issued, swap this out for nginx.conf
# and reload — see docs/DEPLOYMENT.md.

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name bongochee.co.tz api.bongochee.co.tz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
    }
}
