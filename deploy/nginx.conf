# Host-level reverse proxy: SSL termination + routing to the backend/frontend
# containers. Not to be confused with frontend/nginx.conf, which stays as the
# frontend container's own internal static-file server (plain HTTP, container-only).
#
# Domains are placeholders matching backend/.env.example — swap in your real ones.
# See docs/DEPLOYMENT.md for the first-boot bootstrap (the HTTPS server blocks
# below reference certs that don't exist yet on a brand new server).

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

# Plain HTTP: redirect everything to HTTPS, except the certbot ACME challenge path
# (certbot's webroot plugin serves its token here to prove domain ownership).
server {
    listen 80;
    server_name bongochee.cloud api.bongochee.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.bongochee.cloud;

    ssl_certificate     /etc/letsencrypt/live/bongochee.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bongochee.cloud/privkey.pem;

    client_max_body_size 50M;  # Excel stock imports, return photos, and database restore uploads
    gzip on;
    gzip_types application/json text/css application/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location / {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django's SECURE_PROXY_SSL_HEADER (config/settings.py) trusts this to know
        # the original request was HTTPS — required for SECURE_SSL_REDIRECT to not loop.
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bongochee.cloud;

    ssl_certificate     /etc/letsencrypt/live/bongochee.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bongochee.cloud/privkey.pem;

    gzip on;
    gzip_types text/css application/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
