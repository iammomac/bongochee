# Production overlay — layer on top of the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Stops publishing db/backend/frontend ports directly to the host (only the
# reverse-proxy nginx faces the internet) and adds that reverse proxy + certbot's
# renewal loop. See docs/DEPLOYMENT.md for first-boot cert bootstrapping.
services:
  db:
    ports: []

  backend:
    ports: []

  frontend:
    ports: []

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Renews twice a day (certbot no-ops unless a cert is within its renewal window);
    # the first certificate itself is issued manually, see docs/DEPLOYMENT.md.
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"

volumes:
  certbot_www:
  certbot_certs:
